org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Release signing (DO NOT put real secrets here; this file is committed) ---
# Put these in ~/.gradle/gradle.properties, a git-ignored keystore.properties at the
# project root, or environment variables (see README):
# RELEASE_STORE_FILE=/absolute/path/to/release.jks
# RELEASE_STORE_PASSWORD=...
# RELEASE_KEY_ALIAS=...
# RELEASE_KEY_PASSWORD=...

# --- AdMob (defaults are Google's official TEST ids; replace before release) ---
# ADMOB_APP_ID=ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy
# ADMOB_BANNER_ID=ca-app-pub-xxxxxxxxxxxxxxxx/zzzzzzzzzz
